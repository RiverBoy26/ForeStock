spring.application.name=forecast-service

server.port=8000

forecast.storage=./forecast-data

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/forecast_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=4GB

nonton.base-url=${NONTON_BASE_URL:http://127.0.0.1:8080}
nonton.api-key=${NONTON_API_KEY:}
nonton.connect-timeout=${NONTON_CONNECT_TIMEOUT:10s}
nonton.read-timeout=${NONTON_READ_TIMEOUT:30m}
