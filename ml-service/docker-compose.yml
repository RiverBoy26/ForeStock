services:
  forecast:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - NONTON_API_KEY=${NONTON_API_KEY:?Set NONTON_API_KEY in .env}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
